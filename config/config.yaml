mysql:
  user: live_stream
  password: "live_stream_dev"
  host: "127.0.0.1"
  port: 3306
  dbname: live_stream
  charset: utf8mb4

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  username: ""

kafka:
  brokers:
    - "127.0.0.1:9092"
  group_id: "live-danmu-consumer"
  danmu_topic: "danmu_topic"

stream_list:
  count: 20

danmaku:
  # 最近弹幕用于 WebSocket 出现缺口或重连后的快速补拉。超过该窗口时回源 MySQL。
  recent_cache:
    size: 1000
    ttl_seconds: 300
  # 热门房间仍优先实时推送；预计扇出超过预算时才按比例采样，完整数据可从缓存补拉。
  hot_room:
    adaptive_sampling_enabled: true
    online_threshold: 5000
    max_fanout_deliveries_per_second: 150000
    max_sample_stride: 16
    presence_interval_milliseconds: 1000
  # like_count 是历史累计展示值；以下实时信号只用于 Redis 热度榜。
  # 权重是未经业务实验校准的初始配置，使用对数压缩防止单项量级支配排序。
  hot_ranking:
    enabled: true
    refresh_interval_milliseconds: 3000
    metric_bucket_ttl_seconds: 180
    presence_ttl_seconds: 10
    max_like_contributions_per_user_minute: 10
    online_weight: 3.0
    like_weight: 2.0
    danma_weight: 1.0
    freshness_weight: 1.0
    freshness_decay_minutes: 30.0
  # 慢客户端先丢旧保新并提示补拉，持续积压才断开，避免一次瞬时抖动触发雪崩。
  slow_client:
    queue_high_watermark_percent: 75
    disconnect_strikes: 100
    disconnect_grace_milliseconds: 5000
  # 用户可以连续点赞，但限制单个用户对单个房间的瞬时频率。
  like:
    max_per_second: 10
    # 点赞按房间聚合后批量持久化；任一条件满足即刷新。
    batch_size: 100
    batch_wait_milliseconds: 200
    # message_id 在 Redis 中承担客户端重试去重；pending 使用较短租约，
    # Kafka 已确认后延长为完整幂等窗口。
    idempotency_ttl_seconds: 86400
    reservation_ttl_seconds: 60
    # MySQL 是点赞真相源，定期恢复 Redis 镜像，覆盖 Redis 重启/清空场景。
    reconcile_interval_seconds: 30

server:
  # 本地/LAN 使用 HTTP 时为 false；HTTPS 生产环境改为 true。
  cookie_secure: false
  # 前后端同站点或本地开发使用 lax；跨站 HTTPS 部署可改为 none。
  cookie_same_site: "lax"
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://benchmark.local"
