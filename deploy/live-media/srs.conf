# Linux host-network deployment. Management and callbacks stay on loopback.
listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

http_api {
    enabled on;
    listen 127.0.0.1:1985;
    crossdomain off;
}
http_server {
    enabled on;
    listen 127.0.0.1:8080;
    dir ./objs/nginx/html;
}
vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_path ./objs/nginx/html;
        hls_fragment 2;
        # Keep enough segments for browsers that join while the first playlist
        # and player bundle are still loading.
        hls_window 30;
        hls_cleanup on;
        hls_dispose 30;
    }
    http_hooks {
        enabled on;
        on_publish http://127.0.0.1:9001/hooks/srs;
        on_unpublish http://127.0.0.1:9001/hooks/srs;
    }
}
